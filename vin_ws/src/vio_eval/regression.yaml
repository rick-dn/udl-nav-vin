# Regression cases for regression.py
#
# Each case replays a bag (optionally with a fault scenario), scores it with
# score_run.py's default alignment, and fails if a metric goes over its limit.
# "baseline" is what OpenVINS scored when the limits were set (2026-11-19);
# limits are roughly 1.5x baseline plus a little slack, so small run-to-run
# changes pass and real regressions don't.
#
# When the estimator gets better, tighten the limits. When it gets worse on
# purpose (a trade-off), say why next to the new limit.

cases:
  - name: easy
    bag: set_easy
    baseline: {ate_rmse_m: 0.022, ate_max_m: 0.044}
    limits:   {ate_rmse_m: 0.045, ate_max_m: 0.09, scale_error_pct: 3.0}

  - name: medium
    bag: set_medium
    baseline: {ate_rmse_m: 0.075, ate_max_m: 0.152}
    limits:   {ate_rmse_m: 0.12, ate_max_m: 0.25, scale_error_pct: 3.0}

  - name: weak
    bag: set_weak
    baseline: {ate_rmse_m: 0.025, ate_max_m: 0.052}
    limits:   {ate_rmse_m: 0.05, ate_max_m: 0.10, scale_error_pct: 3.0}

  # OpenVINS does badly here (seems to initialise badly, then fast turns).
  # The limit only catches it getting worse still.
  - name: hard
    bag: set_hard
    baseline: {ate_rmse_m: 1.207, ate_max_m: 3.803}
    limits:   {ate_rmse_m: 1.8, ate_max_m: 5.5}

  - name: realistic_noise
    bag: square_02
    faults: realistic
    baseline: {ate_rmse_m: 0.045, ate_max_m: 0.102}
    limits:   {ate_rmse_m: 0.08, ate_max_m: 0.16, scale_error_pct: 5.0}

  - name: time_offset_20ms
    bag: square_02
    faults: time_offset_20ms
    baseline: {ate_rmse_m: 0.110, ate_max_m: 0.422}
    limits:   {ate_rmse_m: 0.17, ate_max_m: 0.65}

  - name: darkness_4s
    bag: square_02
    faults: dark_4s
    baseline: {ate_rmse_m: 0.042, ate_max_m: 0.074}
    limits:   {ate_rmse_m: 0.07, ate_max_m: 0.12}
